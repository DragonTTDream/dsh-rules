# vision-forward 配置示例（贴进 profile 的 cordis.patch.yml 的 insert 段）
- insert:
    - id: vision-forward
      name: dsh-vision-forward
      config:
        probe: false          # true = 只观察不改消息
        logImages: true
        replace: false        # 必须活到 llm/stream 才被转录，这里别开
        transcribe: true      # pre-step 开离线窗口真转录

        logFile: ~/.dsh/vision-forward.log
        endpoint: http://127.0.0.1:8080

        # 孪生条目：声明 image 输入，llm/stream 见到就改道
        twinModel: your-text-plus-image-alias
        mainProvider: llm
        mainModel: your-text-model
        ocrModel: your-ocr-model       # 默认道：逐字转录
        vlmModel: your-vision-model    # 升级道：图表读数/空间理解

        statusPath: /v1/models
        unloadPath: /api/models/unload
        warmAfterRun: true
        requestTimeoutSec: 300
        maxTokens: 8192       # 太小会让思考链吃满、content 为空
        maxImageMB: 8

        # 原生识图的条目 ⇒ 这些会话里拒绝调 vision 工具（图本来就进上下文）
        nativeVisionModels: []
        #  - your-native-vision-model

        # 显存让出的等待
        vramFreeTargetMB: 0
        vramWaitMs: 20000
