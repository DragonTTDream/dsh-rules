# self-recall 配置示例（贴进 profile 的 cordis.patch.yml 的 insert 段）
# 新增条目必须走 insert：`- id:` 只用于覆盖 bundle 里已存在的条目。
- insert:
    - id: self-recall
      name: dsh-self-recall
      config:
        # 本地推理端点与要保活的会话模型
        endpoint: http://127.0.0.1:8080
        model: your-local-model-id

        # 保活：请求失败后指数退避重试，无上限（0 = 不设上限）
        initialDelayMs: 5000
        maxDelayMs: 30000
        jitterRatio: 0.2
        maxAttempts: 0
        resetAfterMs: 300000

        # 卸载/预热端点
        statusPath: /v1/models
        unloadPath: /api/models/unload

        # 资源红线（MB）。低于 memFloorMB 才算紧；高于 freeRunMB 可以自由跑
        memFloorMB: 4096
        freeRunMB: 8192
        modelGB: 16

        # 跑完自动回归并预热
        warmAfterRun: true

        # 辅助模型：重活前先卸掉它们（谁卸谁），再装主模型，否则会 OOM
        auxModels: []
        #  - your-vision-model
        #  - your-ocr-model

        # 跟随会话当前模型：命中任一即用它；都不命中（会话在云端模型上）⇒ 跳过预热
        localModels:
          - your-local-model-id

        # 本机纪律已内化进工具描述时不发技能
        shipSkill: false

        # 早退（2026-10-22）：进程退出却没写 marker ⇒ 立即失败；活着但日志静默 N 分钟 ⇒ 判空转
        failFastSec: 8        # 最早 3 秒；进程没了且无 marker 就返回 script-died / no-start
        stallMinutes: 10
        # 重跑治理（2026-10-22）：按失败类型判能不能重跑，而不是按脚本有没有变硬拦
        attemptBudget: 2      # 同一脚本（intermittent 类）最多尝试次数，0 = 不限
        circuitAfter: 3       # 连续 N 次同因失败 ⇒ 熔断，要求换方法
        ledgerPath: ~/.dsh/arbitrate/attempts.jsonl
      # 日志 N 分钟没新增一个字节 ⇒ marker=stall；0 = 关

        # 待回归兜底的轮询间隔
        pendingScanMs: 15000
        pendingWarm: true
        warmSelfScript: true
        warmOnlyLocalSession: true
